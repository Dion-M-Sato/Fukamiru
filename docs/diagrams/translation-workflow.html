<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>翻訳ワークフロー · ふかみる</title>
  <style>
    :root{color-scheme:dark;--bg:#090c10;--panel:#11161c;--panel2:#171d24;--line:#2b3540;--strong:#465360;--text:#e8eef3;--muted:#99a7b5;--dim:#6f7c88;--accent:#a88cff;--primary:#86a0b5;--repair:#ef8f5a;--focus:#7ae0b4;font-family:Inter,"Noto Sans JP","Yu Gothic UI",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-width:320px;height:100vh;color:var(--text);background:var(--bg)}button,a{font:inherit}a{color:inherit}.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh;min-height:580px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 20px;border-bottom:1px solid var(--line);background:var(--panel)}.eyebrow{color:var(--accent);font:700 10px Consolas,monospace;letter-spacing:.11em}.top h1{margin:3px 0 0;font-size:17px}.top p{margin:3px 0 0;color:var(--muted);font-size:11px}.meta{display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--muted);font-size:11px}.meta strong{color:var(--text)}.back{padding:7px 10px;border:1px solid var(--line);border-radius:5px;color:var(--muted);text-decoration:none}.back:hover{border-color:var(--accent);color:var(--text)}.main{display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:0}.map-scroll{overflow:auto;min-width:0;background:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px),#0b0f14;background-size:24px 24px}.flow-canvas{position:relative;display:inline-block;min-width:100%;min-height:100%;padding:24px}.flow-edges{position:absolute;inset:0;z-index:0;overflow:visible;pointer-events:none}.flow-edge{fill:none;stroke:var(--primary);stroke-width:1.7;opacity:.68;vector-effect:non-scaling-stroke}.flow-edge.conditional{stroke:var(--repair);stroke-dasharray:6 4}.flow-columns{position:relative;z-index:1;display:flex;align-items:flex-start;gap:66px;width:max-content;min-height:100%}.flow-column{width:230px;flex:none}.column-heading{height:36px;margin-bottom:11px;padding-bottom:8px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px}.column-heading strong{color:var(--dim);font:11px Consolas,monospace;margin-right:6px}.flow-node-list{display:grid;gap:12px}.flow-node{display:block;width:100%;min-height:74px;padding:10px;border:1px solid var(--strong);border-radius:7px;background:#171d24;color:var(--text);text-align:left;cursor:pointer;box-shadow:0 3px 9px #0004}.flow-node:hover,.flow-node.selected{border-color:var(--focus);box-shadow:0 0 0 2px #7ae0b433}.flow-node small{display:block;overflow:hidden;margin-bottom:5px;color:var(--muted);font:9px Consolas,monospace;text-overflow:ellipsis;white-space:nowrap}.flow-node strong{display:block;font-size:11px;line-height:1.4}.flow-node .lane{display:inline-block;margin-top:7px;padding:2px 5px;border:1px solid var(--line);border-radius:3px;color:var(--muted);font:9px Consolas,monospace}.inspector{overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:17px}.inspector h2{margin:7px 0;font-size:17px;overflow-wrap:anywhere}.inspector p{color:var(--muted);font-size:12px;line-height:1.6;overflow-wrap:anywhere}.detail{padding:12px 0;border-top:1px solid var(--line)}.detail h3{margin:0 0 6px;color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.detail code{color:#c8b7ff;font:10px Consolas,monospace;overflow-wrap:anywhere}.links{display:grid;gap:5px}.links button{padding:7px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);color:var(--text);text-align:left;font-size:10px;cursor:pointer}.links button:hover{border-color:var(--focus)}.status{position:absolute;left:14px;bottom:12px;z-index:3;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:#11161ce8;color:var(--muted);font-size:10px;pointer-events:none}.error{padding:16px;color:#ffb4a0;font-size:13px}
    @media(max-width:760px){.top{align-items:flex-start;flex-wrap:wrap;padding:11px 13px}.meta{width:100%;justify-content:space-between}.main{display:flex;flex-direction:column}.map-scroll{height:58vh;min-height:330px}.inspector{height:auto;max-height:35vh;border-top:1px solid var(--line);border-left:0}.flow-columns{gap:44px}.flow-column{width:210px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top"><div><div class="eyebrow">WORKFLOW MAP · LIVE DEFINITION</div><h1>翻訳ワークフロー</h1><p id="workflow-note">現在のローカル実行定義から構成と接続を読み込んでいます。</p></div><div class="meta"><span><strong id="workflow-version">—</strong></span><span><strong id="workflow-node-count">—</strong> ノード</span><span><strong id="workflow-edge-count">—</strong> 接続</span><a class="back" href="/">ふかみるへ戻る</a></div></header>
    <main class="main"><div class="map-scroll" id="map-scroll" aria-label="翻訳処理ノードの依存関係"><div class="flow-canvas" id="flow-canvas"><svg class="flow-edges" id="flow-edges" aria-hidden="true"><defs><marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#86a0b5"/></marker><marker id="flow-arrow-conditional" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#ef8f5a"/></marker></defs></svg><div class="flow-columns" id="flow-columns"></div></div><div class="status">左から右へ処理が進みます · 横スクロールで全体を確認</div></div><aside class="inspector" id="flow-inspector" aria-live="polite"><div class="eyebrow">NODE INSPECTOR</div><h2>翻訳工程を読み込み中</h2><p>現行の翻訳ワークフロー定義を取得しています。</p></aside></main>
  </div>
  <script src="./translation-workflow.js"></script>
</body>
</html>
